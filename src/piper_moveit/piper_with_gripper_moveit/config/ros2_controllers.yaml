# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_controller:
  ros__parameters:
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
joint_state_broadcaster:
  ros__parameters:
    # NOTE: 'publish_topic' is NOT a supported joint_state_broadcaster param (silently ignored).
    # use_local_topics:true makes this broadcaster publish the MOCK setpoint stream to
    # /joint_state_broadcaster/joint_states (and /joint_state_broadcaster/dynamic_joint_states)
    # instead of the global /joint_states, freeing /joint_states to carry REAL arm feedback
    # (published by piper_read_slave_joint). The piper driver consumes this local topic as its
    # command input, so MoveIt execution is unchanged.
    use_local_topics: true