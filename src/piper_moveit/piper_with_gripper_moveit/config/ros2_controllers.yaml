# Measured state; dedicated hardware command topic. Tolerances in rad (arm), m (finger).
controller_manager:
  ros__parameters:
    update_rate: 200
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
arm_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      joint1:
        trajectory: 0.1
        goal: 0.01
      joint2:
        trajectory: 0.1
        goal: 0.01
      joint3:
        trajectory: 0.1
        goal: 0.01
      joint4:
        trajectory: 0.1
        goal: 0.01
      joint5:
        trajectory: 0.1
        goal: 0.01
      joint6:
        trajectory: 0.1
        goal: 0.01
gripper_controller:
  ros__parameters:
    joints:
    - joint7
    command_interfaces:
    - position
    state_interfaces:
    - position
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: false
    constraints:
      goal_time: 2.0
      joint7:
        trajectory: 0.01
        goal: 0.002
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
