# Measured state; dedicated hardware command topic. Tolerances in rad (arm), m (finger).
controller_manager:
  ros__parameters:
    update_rate: 200
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
arm_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: false
    # trajectory: per-joint time-based path tolerance. 0.05 rad (was 0.1, ~30-40 mm at the TCP):
    # PiPER J5 lags ~74 ms equivalent (2026-09-30), ~0.037 rad at 0.5 rad/s, so tighter aborts
    # free moves. Weld segments get a geometric 3 mm TCP following-error check in the planner.
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      joint1:
        trajectory: 0.05
        goal: 0.01
      joint2:
        trajectory: 0.05
        goal: 0.01
      joint3:
        trajectory: 0.05
        goal: 0.01
      joint4:
        trajectory: 0.05
        goal: 0.01
      joint5:
        trajectory: 0.05
        goal: 0.01
      joint6:
        trajectory: 0.05
        goal: 0.01
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
