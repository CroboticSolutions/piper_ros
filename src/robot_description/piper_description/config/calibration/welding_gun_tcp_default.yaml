# Repo default for the welding-gun TCP (piper_welding_gun -> arm_tcp; arm_tcp +X = wire).
# Used only when the robot has no active calibration in
# ~/.ros/calibration/<robot_id>/welding_gun_tcp/current.yaml (see
# hand_eye_calibration/calibration_store.py). GUI Apply never edits this file.
calibration_id: repo-default-TCP-v9
kind: tool_tcp
parent_link: piper_welding_gun
child_link: arm_tcp
# WeldTorch_Assembly.stl wire tip from CAD (2026-11-24, mesh turned 135 deg about the
# flange axis): wire axis (0.7132, 0, 0.7010) in link6, 45.5 deg from the flange axis.
# TCP = nozzle end + 15 mm wire stickout. Real robot uses this until a TCP calibration is applied.
real:
  xyz: "0.000275 0 0.176808"
  rpy: "0 -0.7767800740 0"
sim:
  xyz: "0.000275 0 0.176808"
  rpy: "0 -0.7767800740 0"
